<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central · soubarbarotti</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23FF6A00'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --branco:#FFFFFF; --nevoa:#FFF2E8; --carvao:#241C16; --fumaca:#75685E; --linha:#EFE5DC;
  --ambar:#FFA62B; --laranja:#FF6A00; --brasa:#C24100;
  --display:"Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --texto:Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --leak:radial-gradient(ellipse 70% 100% at 88% 0%, rgba(255,106,0,.26) 0%, rgba(255,166,43,.11) 45%, rgba(255,166,43,0) 100%);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--branco);color:var(--carvao)}
body{font:400 15px/1.5 var(--texto);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brasa)}
:focus-visible{outline:2px solid var(--brasa);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* ---------- barra de cima ---------- */
.barra{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linha);padding-top:env(safe-area-inset-top)}
.barra-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:28px}
.logo{font:700 19px/1 var(--display);letter-spacing:-.03em;display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--laranja);display:inline-block;animation:pisca 1.4s steps(2,start) infinite}
@keyframes pisca{to{visibility:hidden}}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;padding:8px 14px;border-radius:999px;font:500 14px/1 var(--display);cursor:pointer;color:var(--fumaca)}
.nav button[aria-current="page"]{background:var(--carvao);color:var(--branco)}
.nav button .cont{font-size:12px;margin-left:6px;opacity:.7}
.perfil{margin-left:auto;display:flex;align-items:center;gap:12px}
.conexao{font-size:12.5px;color:var(--fumaca);display:flex;align-items:center;gap:6px;white-space:nowrap}
.conexao b{width:8px;height:8px;border-radius:50%;background:var(--linha);display:inline-block}
.conexao.ok b{background:#2F9E5B}.conexao.alerta b{background:var(--ambar)}
.eu{display:flex;align-items:center;gap:10px}
.eu .ini{width:34px;height:34px;border-radius:50%;background:var(--carvao);color:var(--branco);display:grid;place-items:center;font:600 13px/1 var(--display)}
.eu .quem{line-height:1.2}.eu .quem strong{display:block;font:600 14px/1.2 var(--display)}.eu .quem span{font-size:12px;color:var(--fumaca)}

main{max-width:1320px;margin:0 auto;padding:28px 24px 64px}
[hidden]{display:none!important}

/* ---------- visor (abertura do dia) ---------- */
.visor{position:relative;padding:40px 44px 36px;background:var(--leak),var(--branco);border-radius:6px}
.canto{position:absolute;width:26px;height:26px;border-color:var(--carvao);border-style:solid;border-width:0;transition:border-color .3s}
.canto.a{top:0;left:0;border-top-width:2px;border-left-width:2px}.canto.b{top:0;right:0;border-top-width:2px;border-right-width:2px}
.canto.c{bottom:0;left:0;border-bottom-width:2px;border-left-width:2px}.canto.d{bottom:0;right:0;border-bottom-width:2px;border-right-width:2px}
.gravando .canto{border-color:var(--laranja)}
.visor-grade{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end}
.data{font:500 14px/1.4 var(--display);color:var(--fumaca);margin:0 0 18px}
.titulo{font:600 clamp(34px,4.6vw,60px)/1.02 var(--display);letter-spacing:-.04em;margin:0}
.titulo span{display:block;color:var(--fumaca)}
.hud{display:none;justify-content:space-between;font:500 14px/1 var(--display);margin-bottom:26px}
.gravando .hud{display:flex}
.hud .rec{display:flex;align-items:center;gap:8px}
.hud .rec i{width:10px;height:10px;border-radius:50%;background:var(--laranja);animation:pisca 1s steps(2,start) infinite}

.rec-area{display:flex;align-items:center;gap:18px}
.btn-rec{width:92px;height:92px;border-radius:50%;border:2px solid var(--carvao);background:var(--branco);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}
.btn-rec:hover{transform:scale(1.04)}.btn-rec:active{transform:scale(.97)}
.btn-rec i{width:54px;height:54px;border-radius:50%;background:var(--laranja);transition:all .25s}
.gravando .btn-rec i{width:30px;height:30px;border-radius:5px;background:var(--carvao)}
.btn-rec:disabled{opacity:.4;cursor:not-allowed}
.rec-txt strong{display:block;font:600 20px/1.2 var(--display);letter-spacing:-.02em}
.rec-txt span{font-size:13.5px;color:var(--fumaca);display:block;max-width:230px}
.qtd{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fumaca)}
.qtd select{border:1px solid var(--linha);border-radius:999px;padding:4px 10px;background:var(--branco);font-size:13px}

.passo{margin-top:26px;font:500 15px/1.4 var(--display);display:none}
.gravando .passo{display:block}
.fita{margin-top:12px;display:none;gap:18px;overflow:hidden;font-size:13px;color:var(--fumaca);white-space:nowrap;mask-image:linear-gradient(90deg,#000 80%,transparent)}
.gravando .fita,.fita.mostrar{display:flex}
.fita .lead{color:var(--carvao);font-weight:500}.fita .erro,.fita .aviso{color:var(--brasa)}

.roteiro{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:34px}
.meta-dia .rot{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px}
.meta-dia .rot b{font:600 15px/1 var(--display)}
.trilho{height:4px;background:var(--linha);border-radius:2px;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--laranja);border-radius:2px;transition:width .5s}

.aviso-cfg{margin-top:22px;padding:12px 16px;border-radius:10px;background:var(--nevoa);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.aviso-cfg b{color:var(--brasa);font-weight:600}

/* ---------- lista do dia ---------- */
.dia{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:36px;margin-top:40px}
.sec-tit{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.sec-tit h2{font:600 24px/1.1 var(--display);letter-spacing:-.03em;margin:0}
.sec-tit h2 small{font-size:15px;color:var(--fumaca);font-weight:500;margin-left:6px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--carvao);background:var(--carvao);color:var(--branco)}

.item{border-top:1px solid var(--linha)}
.item:last-child{border-bottom:1px solid var(--linha)}
.item-cab{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;background:none;border:0;text-align:left;cursor:pointer}
.item-cab:hover .nome{color:var(--brasa)}
.av{width:44px;height:44px;border-radius:50%;background:var(--nevoa);color:var(--brasa);display:grid;place-items:center;font:600 15px/1 var(--display);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.p{width:30px;height:30px;font-size:11px}
.nome{font:600 16.5px/1.25 var(--display);letter-spacing:-.01em;display:block}
.sub{font-size:13px;color:var(--fumaca);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.nota{font:600 13px/1 var(--display);padding:6px 10px;border-radius:999px;background:var(--nevoa);color:var(--brasa);white-space:nowrap}
.nota.A{background:var(--laranja);color:var(--carvao)}
.selo{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--linha);color:var(--fumaca);white-space:nowrap}
.selo.quente{border-color:var(--laranja);color:var(--brasa)}

.item.aberto{background:linear-gradient(180deg,var(--nevoa),rgba(255,242,232,0) 70%);border-radius:14px;border-top-color:transparent}
.item.aberto + .item{border-top-color:transparent}
.item.aberto .av{background:var(--branco)}
.ficha .porque h4{font:500 12.5px/1.2 var(--texto);color:var(--fumaca);margin:0 0 3px}
.corpo{padding:4px 18px 22px 62px}
.fatos{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;margin-bottom:14px}
.fatos b{font:600 14px/1 var(--display)}
.porque{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;margin-bottom:18px;font-size:14px}
.porque h4{font:500 12.5px/1.2 var(--texto);color:var(--fumaca);margin:0 0 3px}
.porque p{margin:0}
.conferir{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border:1px dashed var(--brasa);border-radius:10px;margin-bottom:16px;font-size:13.5px}

.abas-msg{display:flex;gap:2px;border-bottom:1px solid var(--linha);margin-bottom:10px}
.abas-msg button{background:none;border:0;padding:8px 12px;font:500 13.5px/1 var(--display);color:var(--fumaca);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.abas-msg button[aria-selected="true"]{color:var(--carvao);border-bottom-color:var(--laranja)}
textarea.msg{width:100%;min-height:118px;border:1px solid var(--linha);border-radius:12px;padding:12px 14px;background:var(--branco);resize:vertical;font-size:14.5px;line-height:1.5}
.contador{font-size:12px;color:var(--fumaca);text-align:right;margin-top:4px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:9px 16px;font:500 14px/1 var(--display);cursor:pointer;text-decoration:none;color:var(--carvao);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--carvao)}
.btn.forte{background:var(--brasa);border-color:var(--brasa);color:var(--branco)}
.btn.forte:hover{background:#A33700;border-color:#A33700}
.btn.escuro{background:var(--carvao);border-color:var(--carvao);color:var(--branco)}
.btn.leve{border-color:transparent;color:var(--fumaca)}
.btn.leve:hover{color:var(--carvao);border-color:var(--linha)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:16px;height:16px;flex:none}
.confirma{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--carvao);color:var(--branco);font-size:14px}
.confirma .btn{border-color:rgba(255,255,255,.3);background:transparent;color:var(--branco)}
.confirma .btn.forte{background:var(--branco);color:var(--carvao);border-color:var(--branco)}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:14px}
.links a{color:var(--fumaca)}.links a:hover{color:var(--brasa)}

.lado .bloco{margin-bottom:32px}
.mini{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--linha);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.mini:last-child{border-bottom:1px solid var(--linha)}
.mini strong{font:600 14px/1.25 var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{font-size:12.5px;color:var(--fumaca)}
.mini:hover strong{color:var(--brasa)}
.vazio{padding:28px 0;color:var(--fumaca);font-size:14px}
.vazio strong{display:block;color:var(--carvao);font:600 17px/1.3 var(--display);margin-bottom:4px}

/* ---------- funil (kanban) ---------- */
.funil-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.funil-cab .titulo{font-size:clamp(30px,3.6vw,46px)}
.numeros{display:flex;gap:28px;flex-wrap:wrap}
.numeros div{font-size:13px;color:var(--fumaca)}
.numeros b{display:block;font:600 22px/1.15 var(--display);color:var(--carvao)}
.ferramentas{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.busca{border:1px solid var(--linha);border-radius:999px;padding:9px 16px;min-width:300px;background:var(--branco)}
.ferramentas select{border:1px solid var(--linha);border-radius:999px;padding:9px 14px;background:var(--branco)}
.quadro{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(262px,1fr);gap:14px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x proximity;align-items:start}
.coluna{background:var(--nevoa);border-radius:14px;padding:12px;min-height:220px;scroll-snap-align:start;transition:box-shadow .15s}
.coluna.alvo{box-shadow:inset 0 0 0 2px var(--laranja)}
.coluna.fechado{background:var(--carvao);color:var(--branco)}
.coluna.perdido{background:var(--branco);border:1px dashed var(--linha)}
.col-cab{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 12px}
.col-cab strong{font:600 14.5px/1.2 var(--display)}
.col-cab span{font-size:12.5px;color:var(--fumaca)}
.coluna.fechado .col-cab span{color:rgba(255,255,255,.7)}
.cartao{background:var(--branco);color:var(--carvao);border:1px solid var(--linha);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:grab;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;text-align:left;width:100%}
.cartao:hover{border-color:var(--fumaca)}
.cartao.arrastando{opacity:.4}
.cartao strong{font:600 14px/1.25 var(--display);display:block}
.cartao .sub{font-size:12px;gap:0 8px}
.cartao .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.cartao .tags .selo{font-size:11px;padding:2px 7px}
.cartao .nota{font-size:11.5px;padding:4px 7px;align-self:start}
.quadro.tem-mais{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.cartao .valor{font:600 13px/1 var(--display);margin-top:7px;display:block}
.mais-col{font-size:12.5px;color:var(--fumaca);text-align:center;padding:6px}

/* ---------- ficha (gaveta) ---------- */
.veu{position:fixed;inset:0;background:rgba(36,28,22,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.veu.on{opacity:1;pointer-events:auto}
.ficha{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--branco);z-index:41;transform:translateX(100%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(36,28,22,.12)}
.ficha.on{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s}
.ficha-cab{padding:calc(20px + env(safe-area-inset-top)) 24px 16px;border-bottom:1px solid var(--linha);display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center}
.ficha-cab .av{width:52px;height:52px}
.ficha-cab h3{font:600 20px/1.2 var(--display);letter-spacing:-.02em;margin:0}
.fechar{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;padding:6px 8px;color:var(--fumaca)}
.ficha-corpo{overflow-y:auto;padding:20px 24px 40px;flex:1}
.etapas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.etapas button{border:1px solid var(--linha);background:var(--branco);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.etapas button[aria-pressed="true"]{background:var(--carvao);border-color:var(--carvao);color:var(--branco)}
.campo{margin-bottom:18px}
.campo label{display:block;font-size:12.5px;color:var(--fumaca);margin-bottom:5px}
.campo input,.campo textarea{width:100%;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;background:var(--branco)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ficha h4{font:600 15px/1.2 var(--display);margin:26px 0 10px}
.hist{list-style:none;padding:0;margin:0;font-size:13.5px}
.hist li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--linha)}
.hist time{color:var(--fumaca)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--brasa);width:17px;height:17px}

.assist{border:1px solid var(--linha);border-radius:14px;padding:14px 16px;margin-top:10px}
.assist .leitura{font-size:13.5px;color:var(--fumaca);margin:0 0 8px}
.assist .dica{font-size:13px;margin:10px 0 0;color:var(--fumaca)}
pre.prompt{white-space:pre-wrap;word-break:break-word;background:var(--nevoa);border-radius:12px;padding:14px 16px;font:400 12.5px/1.55 var(--texto);max-height:320px;overflow:auto;margin:0 0 10px}
.dica-leve{font-size:13px;color:var(--fumaca);margin:0 0 10px}
.insights{margin:0 0 18px;border:1px solid var(--linha);border-radius:14px;background:var(--branco)}
.insights summary{cursor:pointer;padding:12px 16px;font:500 14px/1.3 var(--display);list-style:none;display:flex;justify-content:space-between;gap:12px}
.insights summary::-webkit-details-marker{display:none}
.insights summary span{color:var(--fumaca);font-weight:400}
.insights .grade-i{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:4px 16px 16px}
.insights table{width:100%;border-collapse:collapse;font-size:13px}
.insights th{text-align:left;font:500 12.5px/1.2 var(--texto);color:var(--fumaca);padding:6px 0;border-bottom:1px solid var(--linha)}
.insights td{padding:7px 0;border-bottom:1px solid var(--linha)}
.insights td.n{text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums}
.insights .barra-i{height:4px;background:var(--linha);border-radius:2px;margin-top:4px}.insights .barra-i i{display:block;height:100%;background:var(--laranja);border-radius:2px}
@media (max-width:760px){.insights .grade-i{grid-template-columns:1fr}}
.aviso-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--carvao);color:var(--branco);padding:12px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw}
.aviso-toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:1080px){.dia{grid-template-columns:1fr}.roteiro{grid-template-columns:1fr 1fr 1fr;gap:16px}}
@media (max-width:760px){
  .barra-in{padding:10px 16px;gap:12px;flex-wrap:wrap}
  .eu .quem,.conexao span{display:none}
  .nav{order:3;width:100%}.nav button{flex:1}
  main{padding:20px 16px 56px}
  .visor{padding:30px 22px 26px}
  .visor-grade{grid-template-columns:1fr;gap:26px}
  .roteiro{grid-template-columns:1fr;gap:14px}
  .corpo{padding:4px 12px 20px}
  .porque,.duas{grid-template-columns:1fr}
  .item-cab{grid-template-columns:40px minmax(0,1fr);}
  .item-cab .nota-wrap{grid-column:2}
  .busca{min-width:0;flex:1}
  .sec-tit{flex-wrap:wrap}.sec-tit .filtros{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="barra">
  <div class="barra-in">
    <div class="logo" aria-label="soubarbarotti">soubarbarotti<i></i></div>
    <nav class="nav" aria-label="Seções">
      <button id="nav-hoje" aria-current="page" onclick="irPara('hoje')">Hoje</button>
      <button id="nav-funil" onclick="irPara('funil')">Funil<span class="cont num" id="cont-funil"></span></button>
    </nav>
    <div class="perfil">
      <div class="conexao" id="conexao" title=""><b></b><span></span></div>
      <div class="eu"><div class="ini" id="ini">PB</div><div class="quem"><strong id="nome-completo">Pedro Barbarotti Berben</strong><span id="meu-ig">@soubarbarotti</span></div></div>
    </div>
  </div>
</header>

<main>
  <!-- ================= HOJE ================= -->
  <section id="tela-hoje">
    <div class="visor" id="visor">
      <i class="canto a"></i><i class="canto b"></i><i class="canto c"></i><i class="canto d"></i>
      <div class="hud"><span class="rec"><i></i><span>REC</span> <span class="num" id="tc">00:00:00</span></span><span class="num" id="hud-cont">0 de 25 leads</span></div>
      <div class="visor-grade">
        <div>
          <p class="data" id="data"></p>
          <h1 class="titulo" id="titulo">bom dia, pedro.<span>o dia ainda não começou.</span></h1>
        </div>
        <div>
          <div class="rec-area">
            <button class="btn-rec" id="btn-rec" aria-label="Começar o dia" onclick="clicarRec()"><i></i></button>
            <div class="rec-txt"><strong id="rec-titulo">Começar o dia</strong><span id="rec-sub">Busca negócios, valida o Instagram e qualifica os melhores.</span>
              <label class="qtd" id="qtd-wrap">Quantos: <select id="qtd"><option>10</option><option selected>25</option><option>40</option></select></label>
            </div>
          </div>
        </div>
      </div>
      <p class="passo" id="passo"></p>
      <div class="fita" id="fita" aria-live="polite"></div>
      <div class="roteiro" id="roteiro"></div>
      <div id="avisos"></div>
    </div>

    <div class="dia">
      <div>
        <div class="sec-tit">
          <h2>Para chamar <small class="num" id="n-chamar"></small></h2>
          <div class="filtros" id="filtros" role="group" aria-label="Filtrar"></div>
        </div>
        <div id="lista-chamar"></div>
      </div>
      <aside class="lado">
        <div class="bloco"><div class="sec-tit"><h2>Follow-ups <small class="num" id="n-fu"></small></h2></div><div id="lista-fu"></div></div>
        <div class="bloco"><div class="sec-tit"><h2>Retornos <small class="num" id="n-ret"></small></h2></div><div id="lista-ret"></div></div>
      </aside>
    </div>
  </section>

  <!-- ================= FUNIL ================= -->
  <section id="tela-funil" hidden>
    <div class="funil-cab">
      <h1 class="titulo">o funil.<span>do primeiro oi ao contrato.</span></h1>
      <div class="numeros" id="numeros"></div>
    </div>
    <div class="ferramentas">
      <input class="busca" id="busca" type="search" placeholder="Buscar negócio, cidade ou @" oninput="renderFunil()">
      <select id="f-nicho" onchange="renderFunil()" aria-label="Nicho"></select>
      <a class="btn leve" href="/api/exportar.csv">Baixar planilha (CSV)</a>
    </div>
    <details class="insights" id="insights"></details>
    <div class="quadro" id="quadro"></div>
  </section>
</main>

<div class="veu" id="veu" onclick="fecharFicha()"></div>
<aside class="ficha" id="ficha" aria-hidden="true" role="dialog" aria-label="Ficha do lead"></aside>
<div class="aviso-toast" id="toast" role="status"></div>

<script>
/* ============================================================ estado */
let E = null, LEADS = [], tela = "hoje", aberto = null, filtro = "todos", fichaId = null;
const abaMsg = {};          // id -> aba de mensagem escolhida
const aguardando = {};      // id -> {tipo, canal} esperando confirmação de envio
let arrastando = null, timerRotina = null, ultimoFeitos = -1;
const ocupado = {}, sugestoes = {};
let limparResp = null;

const ICO = {
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21l1.7-4.6A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 9.5c.5 2.5 3 5 5.5 5.5l1.2-1.3-2-1-1 .8a5 5 0 0 1-2.2-2.2l.8-1-1-2z"/></svg>',
  copiar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'
};

/* ============================================================ utilidades */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hojeISO = () => E ? E.hoje : new Date().toISOString().slice(0,10);
const dias = (a, b = hojeISO()) => Math.round((new Date(b + "T12:00") - new Date(a.slice(0,10) + "T12:00")) / 864e5);
const brData = iso => iso ? iso.slice(0,10).split("-").reverse().slice(0,2).join("/") : "";
const milhar = n => n == null ? "?" : n >= 1e6 ? (n/1e6).toFixed(1).replace(".",",") + " mi" : n >= 1e4 ? (n/1e3).toFixed(1).replace(".",",").replace(",0","") + " mil" : n.toLocaleString("pt-BR");
const reais = v => "R$ " + Number(v || 0).toLocaleString("pt-BR", {maximumFractionDigits:0});
const iniciais = s => (s || "?").replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean).slice(0,2).map(p => p[0]).join("").toUpperCase();
const nicho = k => (E && E.nichos[k]) || k;
const etapaNome = id => (E.etapas.find(e => e.id === id) || {}).nome || id;

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600); }

async function api(url, corpo){
  const r = await fetch(url, corpo === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corpo)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok && r.status !== 409) throw new Error(j.erro || "falhou");
  return j;
}

function avatar(l, pequeno){
  const foto = l.ig && l.ig.foto;
  return `<span class="av ${pequeno ? "p" : ""}">${foto ? `<img src="${esc(foto)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${esc(iniciais(l.nome))}'))">` : esc(iniciais(l.nome))}</span>`;
}

/* ============================================================ regras do funil */
const FUS = [["fu1", 2, "followup_1", "Follow-up 1"], ["fu2", 5, "followup_2", "Follow-up 2, com o teaser"], ["despedida", 10, "mensagem_despedida", "Despedida"]];

function followup(l){
  if (l.etapa !== "chamado" || !l.crm.data_contato) return null;
  // vale só o follow-up mais recente que já venceu; se ele foi enviado, os anteriores ficam para trás
  const d = dias(l.crm.data_contato), feitos = l.crm.fu || [];
  const vencidos = FUS.filter(([, x]) => d >= x);
  if (!vencidos.length) return null;
  const [tipo, , campo, rotulo] = vencidos[vencidos.length - 1];
  return feitos.includes(tipo) ? null : {tipo, campo, rotulo};
}
function retorno(l){
  const p = l.crm.proximo_passo;
  return p && ["respondeu","call","proposta"].includes(l.etapa) && p <= hojeISO() ? p : null;
}
function precisaConferir(l){ return l.ig && l.ig.ok === null && !l.ig.conferido; }
function canalPadrao(l){ return l.ig && l.ig.username ? "instagram" : "whatsapp"; }

function textoMsg(l, campo){
  if (l.crm.msg && l.crm.msg[campo] != null) return l.crm.msg[campo];
  if (campo === "mensagem_instagram" && !l.ia.mensagem_instagram) return l.ia.mensagem_abordagem || "";
  if (campo === "mensagem_whatsapp" && !l.ia.mensagem_whatsapp) return l.ia.mensagem_abordagem || "";
  return l.ia[campo] || "";
}

/* ============================================================ carregar */
async function carregar(){
  const [est, leads] = await Promise.all([api("/api/estado"), api("/api/leads")]);
  E = est; LEADS = leads;
  render();
  if (E.rotina.rodando) acompanharRotina();
}
function render(){ renderTopo(); renderHoje(); if (tela === "funil") renderFunil(); if (fichaId) renderFicha(); }

function renderTopo(){
  $("nome-completo").textContent = E.nome_completo;
  $("ini").textContent = iniciais(E.nome_completo.split(" ").filter((p,i,a) => i === 0 || i === a.length - 1).join(" "));
  $("meu-ig").textContent = E.instagram;
  const c = $("conexao");
  const exp = E.ig_dias_expirar;
  c.className = "conexao " + (!E.ig_conectado ? "" : exp != null && exp <= 7 ? "alerta" : "ok");
  c.querySelector("span").textContent = !E.ig_conectado ? "Instagram não conectado" : exp != null && exp <= 7 ? `Instagram vence em ${exp} dias` : "Instagram conectado";
  c.title = E.ig_conectado ? "A validação dos perfis é automática" : "Os perfis chegam para você conferir à mão. Veja o README para conectar.";
  $("cont-funil").textContent = LEADS.length || "";
}

/* ============================================================ HOJE */
function saudacao(){ const h = new Date().getHours(); return h < 12 ? "bom dia" : h < 18 ? "boa tarde" : "boa noite"; }

function renderHoje(){
  const r = E.rotina, hoje = hojeISO();
  const paraChamar = LEADS.filter(l => l.etapa === "novo").sort((a,b) => (b.dia > a.dia) - (b.dia < a.dia) || (b.triagem.nota||0) - (a.triagem.nota||0));
  const fus = LEADS.filter(followup), rets = LEADS.filter(retorno);
  const chamadosHoje = LEADS.filter(l => l.crm.data_contato === hoje).length;
  const envHoje = LEADS.reduce((s,l) => s + (l.crm.historico||[]).filter(h => h.data.startsWith(hoje) && /Follow-up|Despedida/.test(h.texto)).length, 0);
  const respondidos = LEADS.filter(l => ["respondeu","call","proposta","fechado"].includes(l.etapa)).length;

  // data e título
  const d = new Date(hoje + "T12:00");
  const dataTxt = d.toLocaleDateString("pt-BR", {weekday:"long", day:"numeric", month:"long"});
  $("data").textContent = dataTxt.charAt(0).toUpperCase() + dataTxt.slice(1) + (E.dias_trabalhados ? `. Dia ${E.dias_trabalhados + (E.leads_hoje ? 0 : 1)} de prospecção.` : ". Primeiro dia de prospecção.");
  let linha2;
  if (r.rodando) linha2 = `procurando os ${r.alvo} de hoje.`;
  else if (!paraChamar.length && !fus.length && !rets.length) linha2 = E.leads_hoje ? "tudo enviado por hoje." : "o dia ainda não começou.";
  else linha2 = [paraChamar.length && `${paraChamar.length} para chamar`, fus.length && `${fus.length} follow-up${fus.length > 1 ? "s" : ""}`, rets.length && `${rets.length} retorno${rets.length > 1 ? "s" : ""}`].filter(Boolean).join(", ") + ".";
  $("titulo").innerHTML = `${saudacao()}, ${esc(E.nome.toLowerCase())}.<span>${esc(linha2)}</span>`;

  // botão REC
  $("visor").classList.toggle("gravando", r.rodando);
  const semChave = !E.ia_ok;
  $("btn-rec").disabled = semChave;
  $("btn-rec").setAttribute("aria-label", r.rodando ? "Parar a busca" : "Começar o dia");
  $("rec-titulo").textContent = r.rodando ? "Parar" : E.leads_hoje ? "Buscar mais" : "Começar o dia";
  $("rec-sub").textContent = r.rodando ? "Os leads aparecem na lista conforme ficam prontos." : E.leads_hoje ? `${E.leads_hoje} já chegaram hoje. Aperte para buscar mais.` : "Busca negócios, valida o Instagram e qualifica os melhores.";
  $("qtd-wrap").hidden = r.rodando;
  if (!r.rodando && !$("qtd")._mexido) $("qtd").value = E.leads_hoje ? "10" : String(E.leads_por_dia);
  $("hud-cont").textContent = `${r.feitos} de ${r.alvo} leads`;
  $("passo").textContent = r.passo || "Preparando…";
  renderFita();

  // roteiro do dia
  const meta = Math.max(E.leads_hoje, chamadosHoje, 1);
  const fuTotal = fus.length + envHoje;
  $("roteiro").innerHTML = [
    ["Chamados hoje", chamadosHoje, E.leads_hoje ? `${chamadosHoje} de ${E.leads_hoje}` : chamadosHoje, chamadosHoje / meta],
    ["Follow-ups", envHoje, fuTotal ? `${envHoje} de ${fuTotal}` : "nenhum hoje", fuTotal ? envHoje / fuTotal : 0],
    ["Conversas abertas", respondidos, respondidos, Math.min(respondidos / 10, 1)]
  ].map(([rot, , txt, p]) => `<div class="meta-dia"><div class="rot"><span>${rot}</span><b class="num">${txt}</b></div><div class="trilho"><i style="width:${Math.round(p*100)}%"></i></div></div>`).join("");

  // avisos de configuração
  const av = [];
  if (!E.ia_ok) av.push(`<b>Falta a chave da Anthropic.</b> Coloque a ANTHROPIC_API_KEY no arquivo .env e reinicie a central.`);
  if (!E.places_ok) av.push(`<b>Falta a chave do Google.</b> Sem a GOOGLE_PLACES_API_KEY no .env, a central não encontra negócios novos.`);
  if (!E.ig_conectado) av.push(`<b>Instagram não conectado.</b> Os perfis chegam marcados para você conferir antes de chamar. Para validar sozinho, rode <code>python configurar_instagram.py</code>.`);
  else if (E.ig_dias_expirar != null && E.ig_dias_expirar <= 7) av.push(`<b>O acesso ao Instagram vence em ${E.ig_dias_expirar} dias.</b> Rode <code>python configurar_instagram.py</code> de novo.`);
  if (r.erro && !r.rodando) av.push(`<b>A última busca parou.</b> ${esc(r.erro)}`);
  $("avisos").innerHTML = av.map(a => `<div class="aviso-cfg">${a}</div>`).join("");

  // filtros
  const cont = {
    todos: paraChamar.length,
    instagram: paraChamar.filter(l => l.ig.username).length,
    whatsapp: paraChamar.filter(l => l.whatsapp).length,
    conferir: paraChamar.filter(precisaConferir).length
  };
  $("filtros").hidden = !paraChamar.length;
  $("filtros").innerHTML = [["todos","Todos"],["instagram","Instagram"],["whatsapp","WhatsApp"],["conferir","Conferir perfil"]]
    .filter(([k]) => k !== "conferir" || cont.conferir)
    .map(([k, t]) => `<button class="chip" aria-pressed="${filtro === k}" onclick="filtro='${k}';renderHoje()">${t} <span class="num">${cont[k]}</span></button>`).join("");
  const lista = paraChamar.filter(l => filtro === "todos" || (filtro === "instagram" ? l.ig.username : filtro === "whatsapp" ? l.whatsapp : precisaConferir(l)));
  $("n-chamar").textContent = paraChamar.length || "";
  $("lista-chamar").innerHTML = lista.length ? lista.map(itemHTML).join("") :
    paraChamar.length ? `<div class="vazio">Nenhum nesse filtro.</div>` :
    `<div class="vazio"><strong>${E.leads_hoje ? "Todo mundo de hoje já foi chamado." : "Ninguém na fila ainda."}</strong>${E.leads_hoje ? "Cuide dos follow-ups ao lado ou aperte Buscar mais." : "Aperte o botão lá em cima e os negócios aparecem aqui conforme forem validados."}</div>`;

  $("n-fu").textContent = fus.length || "";
  $("lista-fu").innerHTML = fus.length ? fus.map(l => miniHTML(l, followup(l).rotulo)).join("") : `<div class="vazio">Nenhum follow-up para hoje.</div>`;
  $("n-ret").textContent = rets.length || "";
  $("lista-ret").innerHTML = rets.length ? rets.map(l => miniHTML(l, `${etapaNome(l.etapa)}, retorno ${brData(retorno(l))}`)).join("") : `<div class="vazio">Nenhum retorno marcado para hoje.</div>`;
}

function renderFita(){
  const r = E.rotina;
  const itens = (r.log || []).slice(-8).reverse();
  $("fita").classList.toggle("mostrar", !r.rodando && !!r.fim && itens.length > 0 && (Date.now()/1000 - r.fim) < 600);
  $("fita").innerHTML = itens.map(x => `<span class="${esc(x.tipo)}">${esc(x.t.slice(0,5))} ${esc(x.msg)}</span>`).join("");
}

function fatosIG(l){
  const ig = l.ig || {}, f = [];
  if (ig.seguidores != null) f.push(`<span><b class="num">${milhar(ig.seguidores)}</b> seguidores</span>`);
  if (ig.dias_ultimo_post != null) f.push(`<span>postou ${ig.dias_ultimo_post === 0 ? "hoje" : ig.dias_ultimo_post === 1 ? "ontem" : `há <b class="num">${ig.dias_ultimo_post}</b> dias`}</span>`);
  if (ig.posts_30d != null) f.push(`<span><b class="num">${ig.posts_30d}</b> posts em 30 dias</span>`);
  if (ig.pct_video != null && ig.verificado) f.push(`<span><b class="num">${ig.pct_video}%</b> em vídeo</span>`);
  if (ig.engajamento != null) f.push(`<span>engajamento <b class="num">${String(ig.engajamento).replace(".",",")}%</b></span>`);
  if (l.nota_google) f.push(`<span><b class="num">${String(l.nota_google).replace(".",",")}</b> no Google (${milhar(l.avaliacoes)})</span>`);
  if (l.tem_pixel) f.push(`<span class="selo quente">anuncia na Meta ou Google</span>`);
  return f.join("");
}

function itemHTML(l){
  const aberta = aberto === l.id, ig = l.ig || {};
  const antigo = l.dia !== hojeISO();
  const cab = `<button class="item-cab" onclick="alternar('${l.id}')" aria-expanded="${aberta}">
      ${avatar(l)}
      <span><span class="nome">${esc(l.nome)}</span>
        <span class="sub">${ig.username ? `<span>@${esc(ig.username)}</span>` : ""}<span>${esc(l.cidade)}</span><span>${esc(nicho(l.nicho))}</span>${antigo ? `<span>desde ${brData(l.dia)}</span>` : ""}</span></span>
      <span class="nota-wrap">${precisaConferir(l) ? `<span class="selo quente">conferir perfil</span> ` : ""}<span class="nota ${esc(l.triagem.classe)}">${l.triagem.classe || ""} ${l.triagem.nota ?? ""}</span></span>
    </button>`;
  if (!aberta) return `<div class="item" id="it-${l.id}">${cab}</div>`;
  return `<div class="item aberto" id="it-${l.id}">${cab}<div class="corpo">
      <div class="fatos">${fatosIG(l)}</div>
      ${precisaConferir(l) ? `<div class="conferir"><span>Confira se o perfil está ativo antes de chamar.</span>
          <a class="btn" href="https://instagram.com/${esc(ig.username)}" target="_blank" rel="noopener">${ICO.ig}Abrir perfil</a>
          <button class="btn escuro" onclick="conferir('${l.id}',true)">Está ativo</button>
          <button class="btn leve" onclick="conferir('${l.id}',false)">Está parado, descartar</button></div>` : ""}
      <div class="porque">
        <div><h4>Por que é lead</h4><p>${esc(l.triagem.motivo)}</p></div>
        <div><h4>Ângulo de venda</h4><p>${esc(l.ia.angulo)}</p></div>
        <div><h4>Ideia do teaser</h4><p>${esc(l.ia.ideia_teaser)}</p></div>
        <div><h4>Verba e lacuna</h4><p>${esc(l.ia.verba)}. ${esc(l.ia.lacuna_video)}</p></div>
      </div>
      ${compositor(l, "abordagem")}
      <div class="links">
        ${l.site ? `<a href="${esc(l.site)}" target="_blank" rel="noopener">Site</a>` : ""}
        ${l.maps ? `<a href="${esc(l.maps)}" target="_blank" rel="noopener">Google Maps</a>` : ""}
        ${l.anuncios ? `<a href="${esc(l.anuncios)}" target="_blank" rel="noopener">Anúncios ativos</a>` : ""}
        ${ig.post_recente ? `<a href="${esc(ig.post_recente)}" target="_blank" rel="noopener">Último post</a>` : ""}
        <a href="#" onclick="abrirFicha('${l.id}','sec-teaser');return false">Prompt do teaser</a>
        <a href="#" onclick="abrirFicha('${l.id}');return false">Abrir ficha</a>
        <a href="#" onclick="descartar('${l.id}');return false">Descartar</a>
      </div>
    </div></div>`;
}

function miniHTML(l, rotulo){
  return `<button class="mini" onclick="abrirFicha('${l.id}')">${avatar(l, true)}<span><strong>${esc(l.nome)}</strong><span>${esc(rotulo)}</span></span><span class="nota ${esc(l.triagem.classe)}">${l.triagem.nota ?? ""}</span></button>`;
}

/* ---------- compositor de mensagem (usado no Hoje e na ficha) ---------- */
function compositor(l, modo){
  // modo "abordagem": abas Instagram/WhatsApp. modo "ficha": todas as mensagens.
  const fu = followup(l);
  let abas;
  if (modo === "abordagem") abas = [["mensagem_instagram","Instagram"],["mensagem_whatsapp","WhatsApp"]];
  else abas = [["mensagem_instagram","Instagram"],["mensagem_whatsapp","WhatsApp"],["followup_1","Follow-up 1"],["followup_2","Follow-up 2"],["mensagem_despedida","Despedida"]];
  let atual = abaMsg[l.id];
  if (!atual || !abas.some(a => a[0] === atual)) atual = modo === "ficha" && fu ? fu.campo : (canalPadrao(l) === "instagram" ? "mensagem_instagram" : "mensagem_whatsapp");
  abaMsg[l.id] = atual;
  const txt = textoMsg(l, atual);
  const tipo = {mensagem_instagram:"abordagem", mensagem_whatsapp:"abordagem", followup_1:"fu1", followup_2:"fu2", mensagem_despedida:"despedida"}[atual];
  const ig = l.ig || {};
  const pend = aguardando[l.id];
  const desab = x => x ? "" : "disabled";
  return `<div class="abas-msg" role="tablist">${abas.map(([k, t]) => `<button role="tab" aria-selected="${k === atual}" onclick="trocarAba('${l.id}','${k}')">${t}${fu && fu.campo === k ? " ●" : ""}</button>`).join("")}</div>
    <textarea class="msg" id="msg-${l.id}" aria-label="Mensagem" oninput="$('cc-${l.id}').textContent=this.value.length+' caracteres'" onchange="salvarMsg('${l.id}','${atual}',this.value)">${esc(txt)}</textarea>
    <div class="contador num" id="cc-${l.id}">${txt.length} caracteres</div>
    ${pend ? `<div class="confirma"><span>Enviou pelo ${pend.canal === "whatsapp" ? "WhatsApp" : "Instagram"}?</span>
        <button class="btn forte" onclick="confirmarEnvio('${l.id}')">Sim, marcar como enviado</button>
        <button class="btn" onclick="delete aguardando['${l.id}'];render()">Ainda não</button></div>` :
    `<div class="acoes">
      <button class="btn ${atual !== "mensagem_whatsapp" ? "forte" : ""}" ${desab(ig.username)} onclick="enviarIG('${l.id}','${tipo}')">${ICO.ig}Copiar e abrir o Instagram</button>
      <button class="btn ${atual === "mensagem_whatsapp" ? "forte" : ""}" ${desab(l.whatsapp)} onclick="enviarWA('${l.id}','${tipo}')" title="${l.whatsapp && !l.whatsapp_provavel ? "Parece telefone fixo. Pode não ter WhatsApp." : ""}">${ICO.wa}Abrir no WhatsApp${l.whatsapp && !l.whatsapp_provavel ? " (fixo?)" : ""}</button>
      ${l.email ? `<a class="btn leve" href="mailto:${esc(l.email)}?subject=${encodeURIComponent("Uma ideia de vídeo para a " + l.nome)}&body=${encodeURIComponent(txt)}" onclick="aguardar('${l.id}','${tipo}','e-mail')">${ICO.mail}E-mail</a>` : ""}
      <button class="btn leve" onclick="copiar('${l.id}')">${ICO.copiar}Copiar</button>
    </div>`}`;
}

function trocarAba(id, k){ abaMsg[id] = k; render(); }
function alternar(id){
  aberto = aberto === id ? null : id; renderHoje();
  if (aberto) requestAnimationFrame(() => $("it-" + id)?.scrollIntoView({block:"nearest", behavior:"smooth"}));
}
function msgAtual(id){ return $("msg-" + id) ? $("msg-" + id).value : ""; }
async function copiar(id){ try { await navigator.clipboard.writeText(msgAtual(id)); toast("Mensagem copiada."); } catch(e){ toast("Não consegui copiar. Selecione o texto e copie."); } }

/* Na primeira mensagem, cada canal usa o próprio texto (DM curta no Instagram, apresentação no WhatsApp).
   Nos follow-ups, vai o texto que está na tela. */
function textoParaEnvio(id, tipo, canal){
  const l = LEADS.find(x => x.id === id);
  if (tipo !== "abordagem") return {campo: abaMsg[id], texto: msgAtual(id)};
  const campo = canal === "whatsapp" ? "mensagem_whatsapp" : "mensagem_instagram";
  const texto = abaMsg[id] === campo ? msgAtual(id) : textoMsg(l, campo);
  abaMsg[id] = campo;
  return {campo, texto};
}
function aguardar(id, tipo, canal, campo, texto){
  aguardando[id] = {tipo, canal, campo: campo || abaMsg[id], texto: texto ?? msgAtual(id)};
  setTimeout(render, 50);
}
async function enviarIG(id, tipo){
  const l = LEADS.find(x => x.id === id);
  const {campo, texto} = textoParaEnvio(id, tipo, "instagram");
  try { await navigator.clipboard.writeText(texto); } catch(e){}
  window.open(`https://ig.me/m/${encodeURIComponent(l.ig.username)}`, "_blank", "noopener");
  toast("Mensagem copiada. Cole na conversa.");
  aguardar(id, tipo, "instagram", campo, texto);
}
function enviarWA(id, tipo){
  const l = LEADS.find(x => x.id === id);
  const {campo, texto} = textoParaEnvio(id, tipo, "whatsapp");
  window.open(`https://wa.me/${l.whatsapp}?text=${encodeURIComponent(texto)}`, "_blank", "noopener");
  aguardar(id, tipo, "whatsapp", campo, texto);
}

async function atualizar(id, corpo, aviso){
  try {
    const novo = await api(`/api/leads/${encodeURIComponent(id)}`, corpo);
    const i = LEADS.findIndex(x => x.id === id);
    if (novo.removido) { LEADS.splice(i, 1); if (fichaId === id) fecharFicha(); }
    else if (i >= 0) LEADS[i] = novo;
    if (aviso) toast(aviso);
    render();
    return novo;
  } catch(e){ toast("Não salvou: " + e.message); }
}

async function confirmarEnvio(id){
  const p = aguardando[id]; delete aguardando[id];
  const eraNovo = LEADS.find(x => x.id === id)?.etapa === "novo";
  const l0 = LEADS.find(x => x.id === id);
  const corpo = {enviado:{tipo:p.tipo, canal:p.canal}};
  if (p.campo && p.texto && p.texto !== (l0.ia[p.campo] || "")) corpo.msg = {[p.campo]: p.texto};
  await atualizar(id, corpo, p.tipo === "abordagem" ? "Chamado. Follow-up em 2 dias." : "Follow-up registrado.");
  if (eraNovo && tela === "hoje" && aberto === id){
    const prox = LEADS.find(l => l.etapa === "novo" && (filtro === "todos" || (filtro === "instagram" ? l.ig.username : filtro === "whatsapp" ? l.whatsapp : precisaConferir(l))));
    aberto = prox ? prox.id : null; renderHoje();
    if (prox) requestAnimationFrame(() => $("it-" + prox.id)?.scrollIntoView({block:"nearest", behavior:"smooth"}));
  }
}
function salvarMsg(id, campo, v){ atualizar(id, {msg:{[campo]: v}}); }
function conferir(id, ok){ atualizar(id, {ig_conferido: ok}, ok ? "Perfil conferido." : "Descartado."); }
function descartar(id){
  const motivo = prompt("Por que descartar? (ex.: já tem produtora, perfil parado, fora do perfil)", "fora do perfil");
  if (motivo !== null) { if (aberto === id) aberto = null; atualizar(id, {descartar: motivo || "sem motivo"}, "Descartado."); }
}

/* ============================================================ rotina (botão REC) */
async function clicarRec(){
  if (E.rotina.rodando) { await api("/api/rotina/parar", {}); toast("Parando depois do negócio atual."); return; }
  const r = await api("/api/rotina/comecar", {quantidade: +$("qtd").value});
  if (!r.rodando && r.erro) { E.rotina = r; renderHoje(); toast(r.erro); return; }
  E.rotina = r; E.rotina.rodando = true; renderHoje(); acompanharRotina();
}
function acompanharRotina(){
  clearInterval(timerRotina);
  let voltas = 0;
  timerRotina = setInterval(async () => {
    try {
      const r = await api("/api/rotina");
      E.rotina = r; voltas++;
      if (r.inicio) { const s = Math.max(0, Math.floor(Date.now()/1000 - r.inicio)); $("tc").textContent = [s/3600, s%3600/60, s%60].map(x => String(Math.floor(x)).padStart(2,"0")).join(":"); }
      $("hud-cont").textContent = `${r.feitos} de ${r.alvo} leads`;
      $("passo").textContent = r.passo || "Preparando…";
      renderFita();
      if (r.feitos !== ultimoFeitos || voltas % 5 === 0 || !r.rodando) { ultimoFeitos = r.feitos; const [est, leads] = await Promise.all([api("/api/estado"), api("/api/leads")]); E = est; LEADS = leads; render(); }
      if (!r.rodando) { clearInterval(timerRotina); toast(r.erro ? "A busca parou. Veja o aviso." : `Pronto: ${r.feitos} lead${r.feitos === 1 ? "" : "s"} novo${r.feitos === 1 ? "" : "s"}.`); }
    } catch(e){}
  }, 1000);
}

/* ============================================================ FUNIL */
function renderFunil(){
  const q = ($("busca").value || "").toLowerCase().trim();
  const fn = $("f-nicho").value;
  const sel = $("f-nicho");
  if (!sel.options.length) sel.innerHTML = `<option value="">Todos os nichos</option>` + Object.entries(E.nichos).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  const vis = LEADS.filter(l => (!fn || l.nicho === fn) && (!q || `${l.nome} ${l.cidade} ${l.ig.username || ""}`.toLowerCase().includes(q)));

  const abordados = LEADS.filter(l => l.etapa !== "novo").length;
  const resp = LEADS.filter(l => ["respondeu","call","proposta","fechado"].includes(l.etapa)).length;
  const somar = et => LEADS.filter(l => l.etapa === et).reduce((s, l) => s + (+l.crm.valor || 0), 0);
  $("numeros").innerHTML = [
    ["Chamados", abordados],
    ["Taxa de resposta", abordados ? Math.round(100 * resp / abordados) + "%" : "–"],
    ["Em proposta", reais(somar("proposta"))],
    ["Fechado", reais(somar("fechado"))]
  ].map(([t, v]) => `<div><b class="num">${v}</b>${t}</div>`).join("");

  renderInsights();
  $("quadro").innerHTML = E.etapas.map(et => {
    const cards = vis.filter(l => l.etapa === et.id).sort((a, b) => (followup(b) ? 1 : 0) - (followup(a) ? 1 : 0) || (b.triagem.nota || 0) - (a.triagem.nota || 0));
    const soma = cards.reduce((s, l) => s + (+l.crm.valor || 0), 0);
    const limite = et.id === "novo" || et.id === "perdido" ? 40 : 200;
    return `<div class="coluna ${et.id}" data-etapa="${et.id}" ondragover="sobre(event)" ondragleave="this.classList.remove('alvo')" ondrop="soltar(event)">
      <div class="col-cab"><strong>${esc(et.nome)}</strong><span class="num">${cards.length}${soma ? " / " + reais(soma) : ""}</span></div>
      ${cards.slice(0, limite).map(cartaoHTML).join("")}
      ${cards.length > limite ? `<div class="mais-col">e mais ${cards.length - limite}. Use a busca.</div>` : ""}
    </div>`;
  }).join("");
  dicaRolagem();
}
function dicaRolagem(){ const q = $("quadro"); q.classList.toggle("tem-mais", q.scrollLeft + q.clientWidth < q.scrollWidth - 8); }
function cartaoHTML(l){
  const fu = followup(l), ret = retorno(l), tags = [];
  if (fu) tags.push(`<span class="selo quente">${esc(fu.rotulo.split(",")[0])} hoje</span>`);
  if (ret) tags.push(`<span class="selo quente">retorno ${brData(ret)}</span>`);
  else if (l.crm.proximo_passo && l.etapa !== "fechado") tags.push(`<span class="selo">retorno ${brData(l.crm.proximo_passo)}</span>`);
  if (l.crm.teaser) tags.push(`<span class="selo">teaser pronto</span>`);
  if (precisaConferir(l)) tags.push(`<span class="selo quente">conferir perfil</span>`);
  if (l.etapa === "chamado" && l.crm.data_contato && !fu) { const d = dias(l.crm.data_contato); tags.push(`<span class="selo">chamado ${d === 0 ? "hoje" : d === 1 ? "ontem" : "há " + d + " dias"}</span>`); }
  return `<button class="cartao" draggable="true" ondragstart="arrastar(event,'${l.id}')" ondragend="this.classList.remove('arrastando')" onclick="abrirFicha('${l.id}')">
    ${avatar(l, true)}
    <span><strong>${esc(l.nome)}</strong><span class="sub"><span>${esc(nicho(l.nicho))}</span><span>${esc(l.cidade)}</span></span>
    ${tags.length ? `<span class="tags">${tags.join("")}</span>` : ""}
    ${l.crm.valor ? `<span class="valor num">${reais(l.crm.valor)}</span>` : ""}</span>
    <span class="nota ${esc(l.triagem.classe)}">${l.triagem.nota ?? ""}</span>
  </button>`;
}
function arrastar(ev, id){ arrastando = id; ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", id); ev.currentTarget.classList.add("arrastando"); }
function sobre(ev){ ev.preventDefault(); ev.currentTarget.classList.add("alvo"); }
function soltar(ev){
  ev.preventDefault();
  const col = ev.currentTarget; col.classList.remove("alvo");
  const id = ev.dataTransfer.getData("text/plain") || arrastando, et = col.dataset.etapa;
  const l = LEADS.find(x => x.id === id);
  if (l && l.etapa !== et) { l.etapa = et; renderFunil(); atualizar(id, {etapa: et}, `Movido para ${etapaNome(et)}.`); }
}

/* ============================================================ assistente */
function upsert(novo){ const i = LEADS.findIndex(x => x.id === novo.id); if (i >= 0) LEADS[i] = novo; }
async function assistir(id, qual, corpo){
  if (ocupado[id + qual]) return;
  ocupado[id + qual] = true; renderFicha();
  try {
    const r = await api(`/api/leads/${encodeURIComponent(id)}/${qual}`, corpo || {});
    if (qual === "teaser") { const l = LEADS.find(x => x.id === id); l.crm.teaser_prompt = r.teaser_prompt; toast("Prompt pronto. Copie e cole no Higgsfield."); }
    if (qual === "responder") { sugestoes[id] = r; upsert(r.lead); limparResp = "resp-" + id; toast("Resposta sugerida."); }
    if (qual === "proposta") { upsert(r.lead); toast("Proposta pronta. Abra e salve em PDF."); }
  } catch(e){ toast(e.message); }
  finally { delete ocupado[id + qual]; render(); }
}
function botaoIA(id, qual, rotulo, extra){
  const busy = ocupado[id + qual];
  return `<button class="btn escuro" ${busy ? "disabled" : ""} onclick="${extra || `assistir('${id}','${qual}')`}">${busy ? "Gerando…" : rotulo}</button>`;
}

        ${canal === "instagram" ? `<button class="btn forte" onclick="navigator.clipboard.writeText($('sug-${l.id}').value).catch(()=>{});window.open('https://ig.me/m/${encodeURIComponent(l.ig.username)}','_blank','noopener');toast('Resposta copiada.')">${ICO.ig}Copiar e abrir o Instagram</button>` : ""}

/* ============================================================ o que está funcionando */
function renderInsights(){
  const chamados = LEADS.filter(l => l.etapa !== "novo" && l.crm.data_contato);
  const respondeu = l => ["respondeu","call","proposta","fechado"].includes(l.etapa) || (l.crm.historico || []).some(h => /^Cliente:|Respondeu/.test(h.texto));
  const box = $("insights");
  if (chamados.length < 5) { box.innerHTML = `<summary>O que está funcionando <span>aparece depois de 5 chamados (${chamados.length} até agora)</span></summary>`; return; }
  const grupo = (titulo, chave, nomes) => {
    const g = {};
    chamados.forEach(l => { const k = chave(l) || "outro"; (g[k] = g[k] || [0, 0]); g[k][0]++; if (respondeu(l)) g[k][1]++; });
    const linhas = Object.entries(g).sort((a, b) => b[1][1] / b[1][0] - a[1][1] / a[1][0]);
    return {titulo, linhas: linhas.map(([k, [c, r]]) => ({nome: nomes ? nomes(k) : k, c, r, t: Math.round(100 * r / c)}))};
  };
  const tabelas = [
    grupo("Por nicho", l => l.nicho, nicho),
    grupo("Por canal", l => l.crm.canal, k => ({instagram:"Instagram", whatsapp:"WhatsApp", "e-mail":"E-mail"}[k] || "Outro")),
    grupo("Por nota", l => l.triagem.classe, k => "Classe " + k)
  ];
  const totalResp = chamados.filter(respondeu).length;
  const melhor = tabelas[0].linhas.filter(x => x.c >= 3 && x.r > 0)[0];
  const resumo = !totalResp ? `nenhuma resposta ainda em ${chamados.length} chamados`
    : melhor ? `${melhor.nome} responde mais: ${melhor.t}% de ${melhor.c} chamados`
    : `${totalResp} resposta${totalResp > 1 ? "s" : ""} em ${chamados.length} chamados`;
  box.innerHTML = `<summary>O que está funcionando <span>${esc(resumo)}</span></summary>
    <div class="grade-i">${tabelas.map(tb => `<table><thead><tr><th>${tb.titulo}</th><th class="n">Chamados</th><th class="n">Resposta</th></tr></thead><tbody>
      ${tb.linhas.map(x => `<tr><td>${esc(x.nome)}<div class="barra-i"><i style="width:${x.t}%"></i></div></td><td class="n">${x.c}</td><td class="n">${x.t}%</td></tr>`).join("")}
    </tbody></table>`).join("")}</div>`;
}

/* ============================================================ navegação */
function irPara(t){
  tela = t;
  $("tela-hoje").hidden = t !== "hoje"; $("tela-funil").hidden = t !== "funil";
  $("nav-hoje").setAttribute("aria-current", t === "hoje" ? "page" : "false");
  $("nav-funil").setAttribute("aria-current", t === "funil" ? "page" : "false");
  if (t === "funil") renderFunil();
  window.scrollTo(0, 0);
  history.replaceState(null, "", "#" + t);
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && fichaId) fecharFicha(); });
$("qtd").addEventListener("change", () => $("qtd")._mexido = true);
$("quadro").addEventListener("scroll", dicaRolagem, {passive:true});
window.addEventListener("resize", () => tela === "funil" && dicaRolagem());
setInterval(async () => { if (!E || E.rotina.rodando) return; try { E = await api("/api/estado"); renderTopo(); } catch(e){} }, 30000);
carregar().then(() => { if (location.hash === "#funil") irPara("funil"); }).catch(() => {
  document.querySelector("main").innerHTML = `<div class="vazio"><strong>A central não respondeu.</strong>Confira se a janela do <code>python app.py</code> está aberta e recarregue a página.</div>`;
});
</script>
