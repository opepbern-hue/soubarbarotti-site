# Configuração do Nixpacks para build e deploy
# Documentação: https://nixpacks.com/docs/configuration/file

[phases.setup]
# Mantém os pacotes detectados automaticamente (Node.js) e adiciona FFmpeg e OpenSSL
nixPkgs = ["...", "ffmpeg", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
# Roda o prisma db push para sincronizar o banco e em seguida inicia o Next.js
cmd = "npm run start:prod"

[variables]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
